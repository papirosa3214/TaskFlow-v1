<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Вкладка/закладка браузера — единственное место, где систему НЕ
       подставляет свою маску (в отличие от apple-touch-icon.png/icon-*.png,
       см. комментарий там) — поэтому здесь скругление рисуем сами.
       rx=96 (512×0.1875) — тот же порядок, что у app-иконок iOS/Android
       (squircle ≈18-22%), не выдуман заново. Остальное — тот же красный
       фон (--color-red, index.css) и путь Material "check", 1:1 с
       apple-touch-icon.png, только с добавленным скруглением фона. -->
  <rect width="512" height="512" rx="96" fill="#e44332" />
  <path
    d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"
    fill="#ffffff"
    transform="translate(100,100) scale(13)"
  />
</svg>
